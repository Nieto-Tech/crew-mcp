name: Publish to npm

# Manual only: run it from the Actions tab. It never runs on push, tag or release.
# It defaults to a dry run; publishing for real means unticking dry_run. package.json is not
# private, so this workflow is the only thing between a run and the public registry. To make a
# real publish need approval, add required reviewers to the `npm` environment in the repo settings.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (npm publish --dry-run): build, test and pack, but publish nothing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance: lets npm verify this build came from this workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # add required reviewers to this environment in the repo settings
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Publish
        run: npm publish --provenance --access public ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
