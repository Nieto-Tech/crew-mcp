name: Publish to npm

# Publishes when a GitHub release is published (`gh release create vX.Y.Z`), after the `npm`
# environment's required reviewer approves the run, so every published version has a tag. Run by
# hand from the Actions tab it is always a dry run: build, test and pack, publish nothing. To
# retry a failed release, re-run that release's run. The `npm` environment only admits `main`
# and `v*` tags.
#
# Auth: npm trusted publishing. npm trusts this workflow file, in this repo, running in the `npm`
# environment, and swaps GitHub's OIDC token (`id-token: write`) for a short-lived publish
# credential. There is no npm token or secret. The package's trusted-publisher settings on
# npmjs.com must name Nieto-Tech / crew-mcp / publish.yml / npm exactly, and `repository.url` in
# package.json must match this repo.
on:
  release:
    types: [published]
  workflow_dispatch: # dry run only

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC) and provenance

# One publish at a time; a second run waits instead of racing the first to the registry.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1+ and Node 22.14+; Node 24 ships npm 11.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in a release build (npm's guidance); setup-node caches by default.
          package-manager-cache: false
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json ($want)"
            exit 1
          fi
      - name: Check the npm version supports trusted publishing
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is older than 11.5.1"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Publish
        run: npm publish --provenance --access public ${{ github.event_name != 'release' && '--dry-run' || '' }}
